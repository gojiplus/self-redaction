name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --all-extras --all-groups
      - run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - run: make lint test analysis package
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "self-redaction $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
