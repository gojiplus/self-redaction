[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "self-redaction"
version = "0.1.0"
description = "Reproducible comparison of record matching and general PII detection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["de-identification", "pii", "privacy", "redaction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
self-redaction = "self_redaction:main"

[project.optional-dependencies]
benchmark = [
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "presidio-analyzer==2.2.364",
]

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "ruff>=0.13.0",
]
release = [
  "twine==7.0.0",
]

[tool.uv]
required-version = "==0.12.5"

[tool.hatch.build.targets.wheel]
include = ["self_redaction.py"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
